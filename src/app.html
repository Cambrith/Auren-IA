<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<!-- LICENSE covers this Open WebUI branding surface, including name, logo,
		visual, textual, symbolic identifiers, metadata, and surrounding UI.
		Do not alter, remove, obscure, or replace it except as LICENSE permits:
		https://docs.openwebui.com/license. -->
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				document.documentElement.classList.add('auren-starting');
				if (window.__aurenDesktop) document.documentElement.classList.add('auren-desktop');
				const elapsed = window.__aurenLoadStarted ? Date.now() - window.__aurenLoadStarted : 0;
				document.documentElement.style.setProperty('--auren-pulse-delay', `${-(elapsed % 2600)}ms`);
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'dark';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = '/lunvri-logo.png';
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
			})();
		</script>

		<title>Auren</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div id="splash-screen" role="status" aria-label="Carregando Auren">
			<img src="/lunvri-logo.png" alt="Auren" fetchpriority="high" />
		</div>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		#splash-screen {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: grid;
			place-items: center;
			background: #111214;
			opacity: 1;
			transition: opacity 360ms ease;
			pointer-events: none;
		}
		#splash-screen img {
			width: 104px;
			height: 104px;
			object-fit: contain;
			filter: grayscale(1) brightness(0.74);
			animation: auren-loading 2.6s ease-in-out infinite;
			animation-delay: var(--auren-pulse-delay, 0ms);
			transform-origin: center;
			will-change: transform, opacity;
		}
		#splash-screen.leaving {
			opacity: 0;
		}
		@keyframes auren-loading {
			0%,
			100% {
				opacity: 0.58;
				transform: scale(0.985);
			}
			50% {
				opacity: 0.92;
				transform: scale(1.015);
			}
		}
		/* Restore saved geometry before exposing the application. */
		html.auren-starting *, html.auren-starting *::before, html.auren-starting *::after,
		html.auren-resuming #sidebar, html.auren-resuming .lunvri-controls, html.auren-resuming .selector {
			transition: none !important;
		}
		html.auren-starting #splash-screen { transition: opacity 360ms ease !important; }
		#splash-screen.leaving img { animation-play-state: paused; }
		@media (prefers-reduced-motion: reduce) {
			#splash-screen img {
				animation: none;
			}
			html.auren-starting #splash-screen, #splash-screen {
				transition: none !important;
			}
		}
	</style>
</html>
